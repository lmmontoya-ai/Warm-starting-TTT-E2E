  require_dataset_fingerprint: true
  allow_missing_fingerprints: false
  require_clean_git_for_production: true
  inspect_real_results_before_commit: false
  bootstrap_resamples: 10000
  bootstrap_seed: 0

t1a:
  conditions:
    - FA_SEED_125M
    - S2_125M_SEED001
    - S2_MINUS_125M_SEED001
    - S3_125M
    - S2_BRIDGE_40PCT_125M
  tasks: [hellaswag, arc_easy, piqa, winogrande]
  examples_per_task: 500
  context_length: 1024
  truncate: false
  inner_adaptation_mask: all_nonpadding_causal_targets
  scoring_mask: continuation_only
