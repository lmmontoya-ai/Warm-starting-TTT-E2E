# Checkpoint targets. Amendment 1 of PREREGISTRATION_REVISION_V3.md withdrew
# every warm-started checkpoint these conditions used to name (revision-v2 E1
# and E3, 760M S2) and found the historical S3 extensions not comparable
# (truncated LR schedule). Those conditions stay registered with
# `target: pending` and every Tier-1 runner refuses them until a dated
# Tier-1 addendum names revision-v3 checkpoints. Only the 8K FA seed, a
# valid parent, keeps its target.
#
# Checkpoints are not hosted with this repo. Restore them with
# scripts/46_restore_stage.py through scripts/91_run_tier1_registry.py
# --restore-source-dir (local stage export) or --restore-repo-id (your HF repo).
pending_target_reason: target pending a dated Tier-1 addendum naming revision-v3 checkpoints

