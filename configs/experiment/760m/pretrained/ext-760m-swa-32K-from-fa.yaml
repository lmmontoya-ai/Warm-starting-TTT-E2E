# @package _global_
defaults:
  - override /training: 760m/ext
  - override /model: 760m
  - _self_

training:
  exp_name: ext-760m-swa-32K-from-fa
  seq_length: 32768
  global_batch_size: 32
  # Naive SWA conversion baseline: FA pretrain -> SWA extension (no TTT inner loop).
  load_part: params
  resume_exp_name: pretrain-760m-fa
  train_mode: pretrain

model:
  seq_modeling_block: SWA
  force_flash: False
  unroll_block_scan: True
  mini_batch_size: 1024
  sliding_window_size: 8192
  rope_theta: 500000
  prime: False
  suffix_len: 0
  feed_forward_prime: swiglu
  # Width-preserving conversion (revision v3): keep the seed's FFN width so the
  # pretrained feed-forward weights are inherited instead of silently reinitialized.
  # The fast-weight (prime) MLPs keep the published TTT-E2E width via prime_intermediate_size.
  intermediate_size: 4096
  attention_pattern: swa
