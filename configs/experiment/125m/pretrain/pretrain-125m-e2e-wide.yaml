# @package _global_
# Parameter-matched scratch control for the width-preserving warm start (revision v3).
# Same recipe as pretrain-125m-e2e, but with the warm-started model's widths: the
# regular FFN keeps the FA seed's 2048 and the prime (fast-weight) MLPs use the
# published 1664. 194.98M parameters, identical to S2 / S2-minus, so an S2-vs-scratch
# comparison is not confounded by the 10.6M extra parameters the warm start carries.
defaults:
  - override /training: 125m/pretrain-8K
  - override /model: 125m
  - _self_

training:
  exp_name: pretrain-125m-e2e-wide
  train_mode: meta
  spec_inner: ["language_model.**.suffix_blocks.feed_forward_prime.**"]
  ilr_init: 0.1
  optimizer_inner:
    optimizer_type: sgd
    lr: 1
    clip_gradient: 1.0

model:
  seq_modeling_block: SWA
  force_flash: False
  unroll_block_scan: True
  mini_batch_size: 1024
  sliding_window_size: 8192
  rope_theta: 500000
  prime: True
  suffix_len: 3
  intermediate_size: 2048
  prime_intermediate_size: 1664
