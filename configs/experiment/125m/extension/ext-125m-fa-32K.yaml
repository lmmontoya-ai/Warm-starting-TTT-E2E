# @package _global_
defaults:
  - override /training: 125m/ext
  - override /model: 125m
  - _self_

training:
  exp_name: ext-125m-fa-32K
  seq_length: 32768
  global_batch_size: 32

model:
  seq_modeling_block: self_attention
  force_flash: True
  mini_batch_size: 32768
  # Revision v3: extend the seed at its own RoPE base (the seed was pretrained at 500000).
  # The earlier 2000000 value changed every rotary frequency relative to the restored weights.
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
