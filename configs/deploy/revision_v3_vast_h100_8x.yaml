# @package _global_
# Revision v3 width-preserving 125M ladder on a single 8x H100 80GB (SXM) box.
# Pure data parallelism, no gradient accumulation:
#   bridge (8K, global batch 64)  -> 8 sequences per GPU
#   extension (32K, global batch 8) -> 1 sequence per GPU
defaults:
  - override /backend: gpu
  - _self_

deploy_paths:
  data:
    dclm_filter_8k: ???
    books3: ???
  checkpoint: ${training.checkpoint_path}

backend:
  distributed: false
  num_processes: 1
  process_id: 0
  num_devices: 8

training:
  n_data_parallel: 8
  n_state_parallel: 1
  accum_steps: 1

hydra:
  mode: RUN
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
